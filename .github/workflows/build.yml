name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空则读取 VERSION 文件)'
        required: false
        type: string
        default: ''
      create_release:
        description: '是否创建 Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package_format }} packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_format: ipk
            sdk_base_url: https://downloads.openwrt.org/releases/23.05.5/targets/x86/64
            sdk_pattern: openwrt-sdk-23.05.5-x86-64_.*Linux-x86_64.tar.xz
          - package_format: apk
            sdk_base_url: https://downloads.openwrt.org/snapshots/targets/x86/64
            sdk_pattern: openwrt-sdk-x86-64_.*Linux-x86_64.tar.zst

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          # 版本真相源: 推送的 tag > 手动输入的 version > 仓库 VERSION 文件
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${GITHUB_REF_NAME}" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ -f VERSION ]; then
            version="$(cat VERSION | tr -d '[:space:]')"
          else
            version="$(date -u +%Y.%m.%d)"
          fi

          if ! printf '%s' "${version}" | grep -Eq '^[0-9][0-9A-Za-z._~+-]*$'; then
            echo "::error::'${version}' cannot be used as an OpenWrt package version."
            echo "::error::Use a version tag like v2.4.3 or 2.4.3."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version}"

      - name: Run contract tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          sh tests/run_all.sh

      - name: Install build dependencies
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y \
            build-essential \
            bison \
            clang \
            curl \
            file \
            flex \
            g++ \
            g++-multilib \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-venv \
            rsync \
            unzip \
            wget \
            xz-utils \
            zlib1g-dev \
            zstd

      - name: Inject version
        run: |
          echo "${{ steps.version.outputs.version }}" > VERSION
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ steps.version.outputs.version }}/" Makefile

      - name: Resolve OpenWrt SDK metadata
        id: sdk
        env:
          SDK_BASE_URL: ${{ matrix.sdk_base_url }}
          SDK_PATTERN: ${{ matrix.sdk_pattern }}
        run: |
          sdk_line="$(
            curl -fsSL "${SDK_BASE_URL}/sha256sums" |
              grep -E "[[:space:]]+\\*?${SDK_PATTERN}$" |
              head -n 1
          )"

          if [ -z "${sdk_line}" ]; then
            echo "::error::Unable to find SDK matching '${SDK_PATTERN}' at ${SDK_BASE_URL}."
            exit 1
          fi

          sdk_sha256="$(printf '%s\n' "${sdk_line}" | awk '{print $1}')"
          sdk_file="$(printf '%s\n' "${sdk_line}" | awk '{print $2}' | sed 's/^\*//')"

          echo "sdk_file=${sdk_file}" >> "${GITHUB_OUTPUT}"
          echo "sdk_sha256=${sdk_sha256}" >> "${GITHUB_OUTPUT}"
          echo "sdk_cache_key=openwrt-sdk-${{ matrix.package_format }}-${sdk_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Cache OpenWrt SDK archive
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: .cache/openwrt-sdk/${{ steps.sdk.outputs.sdk_file }}
          key: ${{ steps.sdk.outputs.sdk_cache_key }}

      - name: Download OpenWrt SDK
        env:
          SDK_BASE_URL: ${{ matrix.sdk_base_url }}
          SDK_FILE: ${{ steps.sdk.outputs.sdk_file }}
          SDK_SHA256: ${{ steps.sdk.outputs.sdk_sha256 }}
        run: |
          mkdir -p .cache/openwrt-sdk

          if [ ! -f ".cache/openwrt-sdk/${SDK_FILE}" ]; then
            curl -fL "${SDK_BASE_URL}/${SDK_FILE}" -o ".cache/openwrt-sdk/${SDK_FILE}"
          fi

          printf '%s  %s\n' "${SDK_SHA256}" ".cache/openwrt-sdk/${SDK_FILE}" | sha256sum -c -

          mkdir -p sdk
          case "${SDK_FILE}" in
            *.tar.zst)
              tar --zstd -xf ".cache/openwrt-sdk/${SDK_FILE}" -C sdk --strip-components=1
              ;;
            *.tar.xz)
              tar -xJf ".cache/openwrt-sdk/${SDK_FILE}" -C sdk --strip-components=1
              ;;
            *)
              echo "::error::Unsupported SDK archive: ${SDK_FILE}"
              exit 1
              ;;
          esac

      - name: Prepare OpenWrt feeds
        working-directory: sdk
        run: |
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare local packages
        run: |
          mkdir -p sdk/package

          rsync -a --delete \
            --exclude='.git' \
            --exclude='sdk' \
            --exclude='dist' \
            --exclude='artifacts' \
            --exclude='.cache' \
            "${GITHUB_WORKSPACE}/" \
            sdk/package/luci-app-openclaw/

          sed -i -E "s/^(PKG_VERSION):=.*/\1:=${{ steps.version.outputs.version }}/" sdk/package/luci-app-openclaw/Makefile
          sed -i -E "s/^(PKG_RELEASE):=.*/\1:=1/" sdk/package/luci-app-openclaw/Makefile

      - name: Configure packages
        working-directory: sdk
        run: |
          cat > .config <<'EOF'
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_LUCI_LANG_zh_Hans=y
          # luci-app-openclaw 依赖 luci-base (luci 前端运行时), 必须先选入并编译
          CONFIG_PACKAGE_luci-base=m
          CONFIG_PACKAGE_luci-app-openclaw=m
          EOF

          sed -i 's/^[[:space:]]*//' .config
          make defconfig

      - name: Compile packages
        working-directory: sdk
        run: |
          # 依赖树: luci-base → luci-app-openclaw; 语言包 luci-i18n-openclaw-zh-cn
          # 由 luci.mk 随主包自动产出 (po/zh_Hans + CONFIG_LUCI_LANG_zh_Hans=y, po2lmo)
          make package/luci-base/clean
          make package/luci-app-openclaw/clean
          make package/luci-base/compile -j"$(nproc)" V=s
          make package/luci-app-openclaw/compile -j"$(nproc)" V=s
          echo "=== openclaw outputs under bin ==="
          find bin/packages -maxdepth 6 -type f -name '*openclaw*' 2>/dev/null | sort || true

      - name: Verify package registration
        working-directory: sdk
        run: |
          echo "=== is luci-app-openclaw registered? (make info) ==="
          make package/luci-app-openclaw/info 2>&1 | head -25 || echo "(info target failed - package NOT registered)"

      - name: Collect packages
        env:
          PACKAGE_FORMAT: ${{ matrix.package_format }}
        run: |
          mkdir -p "artifacts/${PACKAGE_FORMAT}"

          # ipk: luci-app-openclaw_<ver>-r1_all.ipk (下划线+arch)
          # apk: luci-app-openclaw-<ver>-r1.apk      (连字符, apk-tools v3)
          # 命名以 SDK 实产为准, 按前缀收并放宽层级
          find sdk/bin/packages -type f \
            \( -name "luci-app-openclaw*" \
            -o -name "luci-i18n-openclaw-zh-cn*" \) \
            -exec cp -v {} "artifacts/${PACKAGE_FORMAT}/" \;

          echo "=== collected ${{ matrix.package_format }} ==="
          ls -lh "artifacts/${PACKAGE_FORMAT}/" || true
          count="$(find "artifacts/${PACKAGE_FORMAT}" -maxdepth 1 -type f -name "luci-app-openclaw*" | wc -l)"

          if [ "${count}" -lt 1 ]; then
            echo "::error::Missing expected packages for ${PACKAGE_FORMAT}."
            echo "=== everything under sdk/bin/packages ==="
            find sdk/bin/packages -maxdepth 6 -type f | sort
            exit 1
          fi

          rm -rf sdk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.package_format }}
          path: artifacts/${{ matrix.package_format }}/*
          if-no-files-found: error

  run:
    name: Build .run installers
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${GITHUB_REF_NAME}" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ -f VERSION ]; then
            version="$(cat VERSION | tr -d '[:space:]')"
          else
            version="$(date -u +%Y.%m.%d)"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Inject version
        run: echo "${{ steps.version.outputs.version }}" > VERSION

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: Build .run installer (opkg 固件)
        run: |
          chmod +x scripts/build_run.sh
          sh scripts/build_run.sh dist

      - name: Build .apk .run installer (apk 固件)
        run: |
          chmod +x scripts/build_run_apk.sh
          ls -lh dist/*.apk
          sh scripts/build_run_apk.sh dist

      - name: Upload .run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-run
          path: dist/*.run
          if-no-files-found: error

  node:
    name: Build ARM64 musl Node.js
    runs-on: ubuntu-24.04
    needs: run

    outputs:
      node_version: ${{ steps.build_versions.outputs.node_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Node.js version from source
        id: build_versions
        run: |
          # 从 openclaw-env 中提取版本号 (唯一的版本真相源)
          # NODE_VERSION_V2 是当前推荐的 Node.js 版本
          NODE_VER=$(grep -oP 'NODE_VERSION_V2="\K[0-9.]+' root/usr/bin/openclaw-env)
          OC_VER=$(grep -oP 'OC_TESTED_VERSION="\K[^"]+' root/usr/bin/openclaw-env)
          echo "node_version=${NODE_VER}" >> "$GITHUB_OUTPUT"
          echo "oc_version=${OC_VER}" >> "$GITHUB_OUTPUT"
          echo "Node.js: v${NODE_VER}"
          echo "OpenClaw: v${OC_VER}"

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build ARM64 musl Node.js
        run: |
          NODE_VER="${{ steps.build_versions.outputs.node_version }}"
          mkdir -p dist
          echo "=== Building Node.js v${NODE_VER} ARM64 musl (apk lts mode) ==="
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/output" \
            -v "$PWD/scripts/build-node-musl.sh:/build-node-musl.sh:ro" \
            -e "NODE_VER=${NODE_VER}" \
            -e "BUILD_MODE=apk" \
            -e "PKG_TYPE=lts" \
            alpine:3.21 sh /build-node-musl.sh

      - name: Upload Node.js artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-node
          path: dist/*.tar.xz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, run, node]
    if: github.event_name == 'push' || github.event.inputs.create_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${GITHUB_REF_NAME}" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ -f VERSION ]; then
            version="$(cat VERSION | tr -d '[:space:]')"
          else
            version="$(date -u +%Y.%m.%d)"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: packages-*
          merge-multiple: true

      - name: Extract changelog
        id: changelog
        run: |
          VER="${{ steps.version.outputs.version }}"
          CHANGELOG=$(awk "/^## \\[${VER}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="暂无更新日志"
          fi
          {
            echo "content<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            ${{ steps.changelog.outputs.content }}

            ---

            ### 安装方式

            Release 同时支持 **opkg 固件**（OpenWrt ≤24.x / iStoreOS）与 **apk 固件**（OpenWrt 25.x / ZeroWrt 25.x，apk-only 无 opkg），在线安装会自动下载 Node.js 与 OpenClaw。包均由官方 OpenWrt SDK（luci.mk）编译。

            **一、opkg 固件（iStoreOS / OpenWrt ≤24.x）**

            ```bash
            VER=${{ steps.version.outputs.version }}

            # 方式 1: 一键自解压包
            sh luci-app-openclaw_${VER}.run

            # 方式 2: opkg 安装 (主包 + 可选中文翻译)
            opkg install luci-app-openclaw_${VER}-1_all.ipk
            opkg install luci-i18n-openclaw-zh-cn_${VER}-1_all.ipk
            ```

            **二、apk 固件（OpenWrt 25.x / ZeroWrt 25.x，无 opkg）**

            ```bash
            VER=${{ steps.version.outputs.version }}

            # 方式 1: 一键自解压包 (内嵌 .apk)
            sh luci-app-openclaw_${VER}_apk.run

            # 方式 2: 直接安装 .apk (主包 + 可选中文翻译)
            apk add --allow-untrusted luci-app-openclaw-${VER}-r1.apk luci-i18n-openclaw-zh-cn-${VER}-r1.apk
            ```

            **三、Node.js ARM64 musl 运行时**（自托管兜底源）

            - 对应 tar.xz 由 `node` job 产出（版本取自 `root/usr/bin/openclaw-env` 的 `NODE_VERSION_V2`），供 aarch64 设备 OpenClaw 环境安装兜底。

            [使用文档](https://github.com/10000ge10000/luci-app-openclaw#readme) · [问题反馈](https://github.com/10000ge10000/luci-app-openclaw/issues) · [B站](https://space.bilibili.com/59438380) · [博客](https://blog.910501.xyz/)
